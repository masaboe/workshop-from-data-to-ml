name: RC1 smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify structure and artifact contract
        run: python scripts/check_release.py --runtime
