name: Full notebook verification
on:
  workflow_dispatch:
jobs:
  all-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbclient nbformat
      - name: Check original artifact
        run: python scripts/check_release.py --runtime
      - name: Execute all notebooks without touching source models
        run: python scripts/verify_notebooks.py
